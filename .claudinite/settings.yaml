engine:
  channel: "staging"
  releases: "missingbulb/ClaudiniteStagingDistro"
  version: "1.61020.6"
  manifest: "sha512-iRC85eNt6WA/NqrZfTo3YfULKPGzWZ69JKmuLc/1ML/+UOCwzCzm7l3WgZ3S69Vycwk3g5CByRvEf9tmGFN17Q=="
packs:
  channel: "canary"
  declared:
    - "basics"
    - "claudinite-lifecycle"
    - "git-github"
    - "research-project"
    - "claudinite-growth"
    - id: "vascular-coloring"
      source: "local"
    - id: "claude-code-web-users-support"
      config:
        repo: "missingbulb/Shepherd"
      answers:
        store: "missingbulb/Shepherd"
    - id: "github-pages"
      answers:
        publish_set: "Ariel asked (2026-10-02) for a static GitHub Pages site, titled 3D MicroViewer, that loads a z-stack the way NoR Finder loads images and opens it in the 3D stack viewer. The site is microviewer/, with a root index.html that forwards to it: publish_root ., publish_paths index.html microviewer, build_command node microviewer/build.mjs (writes microviewer/config.js, with the Google API key for loading from Drive when the repository has one)."
    - "public-website"
    - "html"
    - "node"
    - "numpy-image-processing"
  sources:
    - "missingbulb/Shepherd"
  manager:
    repo: "missingbulb/Shepherd"
tasks:
  routines:
    default:
      url: "https://api.anthropic.com/v1/claude_code/routines/trig_01Nsb7buSwcZrbJFTWKi6qAv/fire"
      tokenSecret: "CCR_ROUTINE_TOKEN"
  merge:
    "engine/update": "merge-safe-changes"
  frequency:
    "engine/update": "weekly"
